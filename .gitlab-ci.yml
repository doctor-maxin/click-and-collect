stages:
  - deploy

variables:
  NODE_ENV: production
  NUXT_TELEMETRY_DISABLED: "1"

default:
  image: oven/bun:1.3.3
  cache:
    key:
      files:
        - bun.lock
        - package.json
    paths:
      - node_modules/
    policy: pull-push

.ssh_setup: &ssh_setup
  - apk update && apk add openssh-client rsync sshpass
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "PubkeyAcceptedKeyTypes +ssh-rsa" >> /etc/ssh/ssh_config || true
  - eval $(ssh-agent -s)

deploy_staging:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - *ssh_setup
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p ${SSH_PORT:-22} -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - |
      if [ -n "$SSH_PASSPHRASE" ]; then
        echo "$SSH_PASSPHRASE" | SSH_ASKPASS=/bin/cat setsid ssh-add ~/.ssh/id_rsa
      else
        SSH_ASKPASS=/dev/null ssh-add ~/.ssh/id_rsa 2>/dev/null || true
      fi
    - ssh -o BatchMode=yes -o ConnectTimeout=5 -p ${SSH_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST exit
  script:
    - set -euo pipefail
    - echo "$DEV_ENV" > .env
    - ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "mkdir -p '$DEPLOY_PATH_PROD'"
    - rsync -az --delete --exclude='.git' -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" . "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/"
    - echo "Build uploaded to $DEPLOY_HOST:$DEPLOY_PATH"
    - ssh -o BatchMode=yes -p ${SSH_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && bash deploy.sh"
  environment:
    name: staging

deploy_production:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  before_script:
    - *ssh_setup
    - echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p ${SSH_PORT_PROD:-22} -H "$DEPLOY_HOST_PROD" >> ~/.ssh/known_hosts
    - |
      if [ -n "$SSH_PASSPHRASE_PROD" ]; then
        echo "$SSH_PASSPHRASE_PROD" | SSH_ASKPASS=/bin/cat setsid ssh-add ~/.ssh/id_rsa
      else
        SSH_ASKPASS=/dev/null ssh-add ~/.ssh/id_rsa 2>/dev/null || true
      fi
    - ssh -o BatchMode=yes -o ConnectTimeout=5 -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD exit
  script:
    - set -euo pipefail
    - echo "$PROD_ENV" > .env
    - ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "mkdir -p '$DEPLOY_PATH_PROD'"
    - rsync -az --delete --exclude='.git' -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" . "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/"
    - echo "Build uploaded to $DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD"
    - ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "cd $DEPLOY_PATH_PROD && bash deploy-production.sh"
  environment:
    name: production
