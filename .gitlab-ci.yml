stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  NUXT_TELEMETRY_DISABLED: "1"

default:
  image: oven/bun:1.1
  cache:
    key:
      files:
        - bun.lock
        - package.json
    paths:
      - node_modules/
    policy: pull-push

.ssh_setup: &ssh_setup
  - apk update && apk add openssh-client rsync sshpass
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - echo "PubkeyAcceptedKeyTypes +ssh-rsa" >> /etc/ssh/ssh_config || true
  - eval $(ssh-agent -s)

build:
  stage: build
  cache:
    key:
      files:
        - bun.lock
        - package.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - bun --version
    - bun install
    - |
      if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        echo "$DEV_ENV" > .env
      elif [ "$CI_COMMIT_BRANCH" = "master" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "$PROD_ENV" > .env
      fi
    - bun run build
    - test -f .output/server/index.mjs
  artifacts:
    paths:
      - .output/
      - .env
      - ecosystem.config.cjs
      - ecosystem.production.config.cjs
      - deploy.sh
      - deploy-production.sh
    expire_in: 1 week

deploy_staging:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - *ssh_setup
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p ${SSH_PORT:-22} -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - |
      if [ -n "$SSH_PASSPHRASE" ]; then
        echo "$SSH_PASSPHRASE" | SSH_ASKPASS=/bin/cat setsid ssh-add ~/.ssh/id_rsa
      else
        SSH_ASKPASS=/dev/null ssh-add ~/.ssh/id_rsa 2>/dev/null || true
      fi
    - ssh -o BatchMode=yes -o ConnectTimeout=5 -p ${SSH_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST exit
  script:
    - set -euo pipefail
    - printenv | grep -E '^STAGING_(NUXT_|STRAPI_|FTP_|APP_|PORT=|DATABASE_URL=|REDIS_URL=|JWT_|KEY_|SECRET_)' | sed 's/^STAGING_//' | sort > .env
    - ssh -o BatchMode=yes -p ${SSH_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST "mkdir -p '$DEPLOY_PATH'"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT:-22}" .output/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.output/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT:-22}" ecosystem.config.cjs "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/ecosystem.config.cjs"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT:-22}" .env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT:-22}" deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh"
    - echo "Build uploaded to $DEPLOY_HOST:$DEPLOY_PATH"
    - ssh -o BatchMode=yes -p ${SSH_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && bash deploy.sh"
  environment:
    name: staging

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  before_script:
    - *ssh_setup
    - echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p ${SSH_PORT_PROD:-22} -H "$DEPLOY_HOST_PROD" >> ~/.ssh/known_hosts
    - |
      if [ -n "$SSH_PASSPHRASE_PROD" ]; then
        echo "$SSH_PASSPHRASE_PROD" | SSH_ASKPASS=/bin/cat setsid ssh-add ~/.ssh/id_rsa
      else
        SSH_ASKPASS=/dev/null ssh-add ~/.ssh/id_rsa 2>/dev/null || true
      fi
    - ssh -o BatchMode=yes -o ConnectTimeout=5 -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD exit
  script:
    - set -euo pipefail
    - echo "$PROD_ENV" > .env
    - ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "mkdir -p '$DEPLOY_PATH_PROD'"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" .output/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/.output/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" ecosystem.production.config.cjs "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/ecosystem.production.config.cjs"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" .env "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/.env"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" node_modules/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/node_modules/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" src/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/src/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" server/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/server/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" public/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/public/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" shared/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/shared/"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" tsconfig.json "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/tsconfig.json"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" nuxt.config.ts "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/nuxt.config.ts"
    - rsync -az --delete -e "ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22}" deploy-production.sh "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/deploy-production.sh"
    - echo "Build uploaded to $DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD"
    - ssh -o BatchMode=yes -p ${SSH_PORT_PROD:-22} $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "cd $DEPLOY_PATH_PROD && bash deploy-production.sh"
  environment:
    name: production
