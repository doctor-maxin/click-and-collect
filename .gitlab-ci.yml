stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  NUXT_TELEMETRY_DISABLED: "1"

default:
  image: oven/bun:1.1
  cache:
    paths:
      - node_modules/
      - bun.lockb
    policy: pull-push

build:
  stage: build
  script: |
    bun --version
    bun install 
    bun run build
    test -f .output/server/index.mjs
  artifacts:
    paths:
      - .output/
      - ecosystem.config.js
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - apk update && apk add openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script: |
    set -euo pipefail

    printenv | grep -E '^(NUXT_|APP_|PORT=|DATABASE_URL=|REDIS_URL=|JWT_|KEY_|SECRET_)' | sort > .env

    ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "mkdir -p '$DEPLOY_PATH'"

    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" .output/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.output/"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" ecosystem.config.cjs "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/ecosystem.config.cjs"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" .env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"

    echo "Build uploaded to $DEPLOY_HOST:$DEPLOY_PATH"
  after_script: 
    - ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "
        source ~/.bashrc;
        cd '$DEPLOY_PATH';l
        pm2 startOrReload ecosystem.config.cjs --update-env;
        pm2 save;
      "
  environment:
    name: production
