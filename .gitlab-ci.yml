stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  NUXT_TELEMETRY_DISABLED: "1"

default:
  image: oven/bun:1.1
  cache:
    paths:
      - node_modules/
      - bun.lockb
    policy: pull-push

.ssh_setup: &ssh_setup
  - apk update && apk add openssh-client rsync
  - mkdir -p ~/.ssh
  - chmod 600 ~/.ssh/id_rsa
  - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

build:
  stage: build
  script: |
    bun --version
    bun install
    bun run build
    test -f .output/server/index.mjs
  artifacts:
    paths:
      - .output/
      - ecosystem.config.cjs
      - ecosystem.production.config.cjs
      - deploy.sh
      - deploy-production.sh
    expire_in: 1 week

deploy_staging:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - *ssh_setup
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
  script: |
    set -euo pipefail

    printenv | grep -E '^STAGING_(NUXT_|STRAPI_|FTP_|APP_|PORT=|DATABASE_URL=|REDIS_URL=|JWT_|KEY_|SECRET_)' | sed 's/^STAGING_//' | sort > .env

    ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "mkdir -p '$DEPLOY_PATH'"

    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" .output/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.output/"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" ecosystem.config.cjs "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/ecosystem.config.cjs"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" .env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh"

    echo "Build uploaded to $DEPLOY_HOST:$DEPLOY_PATH"

    ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && bash deploy.sh"
  environment:
    name: staging

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk update && apk add openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PROD" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST_PROD" >> ~/.ssh/known_hosts
  script: |
    set -euo pipefail

    printenv | grep -E '^PROD_(NUXT_|STRAPI_|FTP_|APP_|PORT=|DATABASE_URL=|REDIS_URL=|JWT_|KEY_|SECRET_)' | sed 's/^STAGING_//' | sort > .env

    ssh -i ~/.ssh/id_rsa $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "mkdir -p '$DEPLOY_PATH_PROD'"

    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" .output/ "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/.output/"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" ecosystem.production.config.cjs "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/ecosystem.production.config.cjs"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" .env "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/.env"
    rsync -az --delete -e "ssh -i ~/.ssh/id_rsa" deploy-production.sh "$DEPLOY_USER_PROD@$DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD/deploy-production.sh"

    echo "Build uploaded to $DEPLOY_HOST_PROD:$DEPLOY_PATH_PROD"

    ssh -i ~/.ssh/id_rsa $DEPLOY_USER_PROD@$DEPLOY_HOST_PROD "cd $DEPLOY_PATH_PROD && bash deploy-production.sh"
  environment:
    name: production
