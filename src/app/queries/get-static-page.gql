query GetStaticPage($status: PublicationStatus, $filters: PageFiltersInput) {
  pages(status: $status, filters: $filters) {
    title
    handle
    publishedAt
    seo {
      metaTitle
      metaDescription
      canonicalURL
      keywords
      metaRobots
      metaImage {
        url
      }
      openGraph {
        ogTitle
        ogDescription
        ogUrl
        ogType
        ogImage {
          url
        }
      }
    }
    content
    preamble
  }
}
